---

x-base: &base
  restart: unless-stopped
  logging:
    driver: "loki"
    options:
      mode: non-blocking
      loki-url: "http://127.0.0.1:3100/loki/api/v1/push"
      loki-retries: "5"

x-cardano_node_leios: &cardano_node_leios
  image: ${testnet}-leios-prof${PROFILING:-0}:latest
  build:
    context: "../../"
    # Prebuilt Leios node from the weekly ouroboros-leios release instead of a
    # from-source build: minutes instead of hours, and the w30 node pairs with
    # CARDANO_DB_SYNC_REF leios-prototype-2026w30 below (same weekly cadence).
    dockerfile: "cardano-node/Dockerfile.binary"
    args:
      # Prebuilt cardano-node + cardano-cli under bin/. No tx-generator in this
      # tarball; Dockerfile.binary stubs it so the chmod/symlink/COPY resolve.
      CARDANO_NODE_TARBALL_URL: "https://github.com/input-output-hk/ouroboros-leios/releases/download/prototype-2026w30/cardano-node-leios-x86_64-linux.tar.gz"
      # NOT the node's real version: this only names the install directory and
      # must remain a valid git ref, because Dockerfile.binary fetches
      # Loop.plutus from raw.githubusercontent at this ref.
      CARDANO_NODE_VERSION: "10.5.4"
      TESTNET_BUILDER_IMAGE: ${TESTNET_BUILDER_IMAGE}

x-env: &env
  POOL_ID: "0" # Placeholder required for override
  SYSTEM_START: ${SYSTEM_START:-}
  NO_INTERPOOL_LOCALROOTS: ${NO_INTERPOOL_LOCALROOTS:-false}
  PROFILING: ${PROFILING:-}
  SHUTDOWN_ON_BLOCK: ${SHUTDOWN_ON_BLOCK:-}

services:
  p1:
    <<: [*base, *cardano_node_leios]
    container_name: p1
    hostname: p1.example
    volumes:
      - p1:/opt/cardano-node/data
      - synth:/opt/synth:ro
    environment:
      <<: *env
      POOL_ID: "1"
    profiles: [build, core, pools]

  p2:
    <<: [*base, *cardano_node_leios]
    container_name: p2
    hostname: p2.example
    volumes:
      - p2:/opt/cardano-node/data
      - synth:/opt/synth:ro
    environment:
      <<: *env
      POOL_ID: "2"
      PEER_SHARING: "false"
    profiles: [build, core, pools]

  # p3 is a net-rs/net-node FORGER: it takes over pool 3's on-chain identity
  # (same VRF/KES/opcert/cold keys, so the same issuerHash) and produces real
  # Praos blocks. Stake and the epoch nonce come from the genesis staking
  # section via [chain_data] source = "genesis" — no Kleioscan needed.
  # Keeps the p3 name/hostname so p1/p2's generated local-roots still dial it,
  # which makes piranha a TRUSTED upstream for both (kills the peer-preference
  # hypothesis by construction).
  #
  # Requires the prebuilt piranha:latest image in the local image store
  # (produced from a private repo; see PIRANHA-FORGE.md). Not built by this repo.
  p3:
    <<: *base
    image: piranha:latest
    # No platform pin: use the host-native piranha build (arm64 on Apple
    # Silicon, amd64 on Linux). Cross-arch containers still talk over TCP, so a
    # native piranha alongside amd64 node images is fine.
    container_name: p3
    hostname: p3.example
    # Read-only: pool 3's vrf/kes/opcert/cold keys, the PATCHED shelley genesis
    # (its bytes are hashed for the epoch nonce), and the forge config.
    volumes:
      # Host dir holding the forge state (genesis + keys + forge-ignite.toml),
      # populated per PIRANHA-FORGE.md before p3 starts. Repo-relative default
      # (testnets/simple_leios_source/forge), override with FORGE_DIR.
      - ${FORGE_DIR:-./forge}:/etc/forge:ro
    # Explicit entrypoint: bypasses the image's env-driven relay entrypoint so
    # ONLY this config applies. The baked relay.toml would otherwise layer in
    # `[production] stake = 0`, silently disabling forging.
    entrypoint: ["/usr/local/bin/net-node"]
    command: ["--config", "/etc/forge/forge-ignite.toml"]
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
    profiles: [core, pools]
  sidecar:
    image: ${testnet}_sidecar:latest
    container_name: sidecar
    hostname: sidecar.example
    restart: unless-stopped
    build:
      context: "../../"
      dockerfile: "sidecar/Dockerfile"
    environment:
      POOLS: "3"
    volumes:
      - synth:/opt/synth:ro
    profiles: [build, core]

  synth:
    image: ${testnet}_db-synthesizer:latest
    container_name: synth
    restart: no
    environment:
      SYSTEM_START: ${SYSTEM_START:-}
      # Hardcoded to 0: the db-synthesizer is not Leios/Dijkstra-aware. If it ran
      # (PRE_EPOCHS > 0) it would fail to synthesize the chain, so it must never run.
      PRE_EPOCHS: "0"
    volumes:
      - synth:/opt/cardano-node/data
    build:
      context: "../../"
      dockerfile: "db-synthesizer/Dockerfile"
    profiles: [build, core, mgmt]

  # Client / observer node
  c1:
    <<: [*base, *cardano_node_leios]
    container_name: c1
    hostname: c1.example
    volumes:
      - c1:/opt/cardano-node
      - synth:/opt/synth:ro
    environment:
      POOL_ID: "1"
      TYPE: "client"
      SYSTEM_START: ${SYSTEM_START:-}
    profiles: [build, core]

  # TX generator
  c2:
    <<: [*base, *cardano_node_leios]
    container_name: c2
    hostname: c2.example
    volumes:
      - c2:/opt/cardano-node
      - synth:/opt/synth:ro
    environment:
      POOL_ID: "1"
      TYPE: "txg"
      # Use tx-centrifuge (Leios load generator) instead of the legacy tx-generator.
      TX_GEN_MODE: "centrifuge"
      TPS: "50"
      TX_GENERATOR_TARGETS: "p1.example,p2.example,p3.example"
      NETWORK_MAGIC: "42"
      # 2 outputs/tx so on_pull recycle grows the UTxO pool -> parallelism -> reaches TPS.
      CENTRIFUGE_OUTPUTS_PER_TX: "2"
      UTXOHD: "true"
      SYSTEM_START: ${SYSTEM_START:-}
    profiles: [build, optional]

  # PostgreSQL Database (used by sidecar for the node graph / convergence helpers)
  db:
    image: postgresql:latest
    container_name: db
    hostname: db.example
    restart: unless-stopped
    volumes:
      - db:/opt/postgresql
    build:
      context: "../../"
      dockerfile: "postgresql/Dockerfile"
    ports:
      - "${PSQL_HOST:-127.0.0.1}:${PSQL_PORT:-5432}:5432"
    profiles: [build, core]

  # Leios/Dijkstra-aware cardano-db-sync, built from source (leios-prototype-2026w26,
  # the tag whose consensus/ledger pins match the Leios node).
  # Distinct image tag so it does not clobber the shared binary `cardano-db-sync:latest`
  # other testnets use.
  dbsync:
    image: ${testnet}-cardano-db-sync:latest
    container_name: dbsync
    hostname: dbsync.example
    restart: unless-stopped
    volumes:
      - dbsync:/opt/cardano-db-sync
      - c1:/opt/cardano-node
    environment:
      DB_HOST: "db.example"
    build:
      context: "../../"
      dockerfile: "cardano-db-sync/Dockerfile.source"
      args:
        CARDANO_DB_SYNC_REF: "leios-prototype-2026w30"
        HASKELL_BUILDER_IMAGE: ${HASKELL_BUILDER_IMAGE}
    depends_on:
      db:
        condition: service_started
    profiles: [build, core]

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: prometheus
    hostname: prometheus.example
    restart: unless-stopped
    volumes:
      - prometheus:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml
    depends_on:
      blackbox:
        condition: service_started
    profiles: [build, core]

  blackbox:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    container_name: blackbox
    hostname: blackbox.example
    restart: unless-stopped
    command: --config.file=/etc/blackbox_exporter/blackbox.yml
    volumes:
      - ../../blackbox:/etc/blackbox_exporter/
    cap_add:
      - NET_ADMIN
      - NET_RAW
    profiles: [build, core]

  loki:
    image: grafana/loki:3.7.2
    container_name: loki
    hostname: loki.example
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${LOKI_HOST:-127.0.0.1}:${LOKI_PORT:-3100}:3100"
    volumes:
      - loki:/loki
    profiles: [build, core]

  grafana:
    image: grafana/grafana:13.0.2
    container_name: grafana
    hostname: grafana.example
    restart: unless-stopped
    ports:
      - "${GRAFANA_HOST:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana:/var/lib/grafana
      - ../../grafana/provisioning:/etc/grafana/provisioning
      # Leios-only dashboards (hard guard): mount the leios dashboards DIRECTORY over the
      # committed (empty) dashboards/leios/ placeholder. Other testnets share grafana/provisioning
      # and see only the empty placeholder, so they load no Leios dashboard. Mounting a directory
      # onto an existing target (not a single file into the dir) avoids Docker creating a stray
      # mount-point file in the shared provisioning dir. The provider loads *.json recursively.
      - ../../grafana/leios:/etc/grafana/provisioning/dashboards/leios:ro
    environment:
      GF_SECURITY_ADMIN_USER: cardano
      GF_SECURITY_ADMIN_PASSWORD: cardano
      GF_FEATURE_TOGGLES_splashScreen: "false"
    profiles: [build, core]

volumes:
  p1:
  p2:
  p3:
  c1:
  c2:
  db:
  dbsync:
  prometheus:
  loki:
  grafana:
  synth:
